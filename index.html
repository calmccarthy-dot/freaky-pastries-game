<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Freaky Pastries</title>
  <style>
    :root {
      --bg1: #140d1c;
      --bg2: #2d1a39;
      --panel: rgba(24, 15, 31, 0.78);
      --accent: #ff7b7b;
      --accent2: #ffc857;
      --good: #89ecb2;
      --warning: #ffd166;
      --text: #f6efff;
      --shadow: rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at top, #3f2147, var(--bg1) 54%, #07070d 100%);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    body {
      display: grid;
      place-items: center;
    }

    #gameWrap {
      position: relative;
      width: min(92vw, 900px);
      height: min(72vw, 600px);
      max-height: 600px;
      border: 3px solid rgba(255,255,255,0.14);
      border-radius: 18px;
      overflow: hidden;
      background: linear-gradient(180deg, rgba(19, 10, 24, 0.95), rgba(11, 8, 16, 1));
      box-shadow: 0 0 50px rgba(255, 102, 126, 0.18);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background:
        linear-gradient(180deg, rgba(80,31,89,0.35), rgba(12,8,18,0.9)),
        radial-gradient(circle at top, rgba(255,255,255,0.08), transparent 35%);
    }

    #hud {
      position: absolute;
      inset: 0 0 auto 0;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 16px 18px;
      pointer-events: none;
      font-weight: 700;
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.38);
    }

    .stat {
      background: rgba(15, 9, 18, 0.56);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      padding: 8px 12px;
      backdrop-filter: blur(4px);
      letter-spacing: 0.05em;
    }

    #message {
      position: absolute;
      inset: auto auto 26px 50%;
      transform: translateX(-50%);
      display: none;
      background: rgba(20, 14, 23, 0.76);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      padding: 10px 18px;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #f8dbee;
      white-space: nowrap;
    }

    #gameOver {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(7, 5, 12, 0.68);
    }

    #gameOverBox {
      background: rgba(27, 18, 33, 0.94);
      border: 2px solid rgba(255,255,255,0.12);
      border-radius: 18px;
      padding: 24px 28px;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 18px 46px rgba(0,0,0,0.38);
    }

    #gameOverBox h1 {
      margin: 0 0 10px;
      font-size: clamp(30px, 4.5vw, 52px);
      color: var(--accent);
      letter-spacing: 0.04em;
    }

    #gameOverBox p {
      margin: 10px 0;
      color: var(--text);
      font-size: clamp(14px, 2vw, 18px);
    }

    button {
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      color: #221922;
      background: linear-gradient(135deg, var(--accent2), #ffeaa4);
      box-shadow: 0 10px 20px rgba(255, 200, 87, 0.3);
    }
  </style>
</head>
<body>
  <div id="gameWrap">
    <canvas id="game" width="900" height="600"></canvas>

    <div id="hud">
      <div class="stat">Health: <span id="health">100</span></div>
      <div class="stat">Score: <span id="score">0</span></div>
      <div class="stat">Wave: <span id="wave">1</span></div>
    </div>

    <div id="message">Press R to restart</div>

    <div id="gameOver">
      <div id="gameOverBox">
        <h1>Pastry Panic!</h1>
        <p id="finalScore">Final Score: 0</p>
        <p>The bakery sent out the freakiest pastries and won.</p>
        <button id="restartBtn">Try Again</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    const healthEl = document.getElementById('health');
    const scoreEl = document.getElementById('score');
    const waveEl = document.getElementById('wave');
    const messageEl = document.getElementById('message');
    const gameOverEl = document.getElementById('gameOver');
    const finalScoreEl = document.getElementById('finalScore');
    const restartBtn = document.getElementById('restartBtn');

    const keys = {};
    let gameOver = false;
    let lastTime = 0;
    let animationId = 0;

    const state = {
      score: 0,
      wave: 1,
      enemies: [],
      bullets: [],
      enemyBullets: [],
      particles: [],
      stars: [],
      powerUps: [],
      enemySpawnCooldown: 0,
      waveDelay: 0,
      nextEnemyId: 1
    };

    const player = {
      x: canvas.width / 2,
      y: canvas.height - 64,
      w: 36,
      h: 46,
      speed: 320,
      fireCooldown: 0,
      firingRate: 0.18,
      health: 100,
      maxHealth: 100,
      damageFlash: 0,
      shootLevel: 1,
      shield: 0
    };

    function randomRange(min, max) {
      return Math.random() * (max - min) + min;
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function resetGame() {
      gameOver = false;
      state.score = 0;
      state.wave = 1;
      state.enemies = [];
      state.bullets = [];
      state.enemyBullets = [];
      state.particles = [];
      state.powerUps = [];
      state.enemySpawnCooldown = 0.2;
      state.waveDelay = 0;
      state.stars = Array.from({ length: 90 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 2.2 + 0.7,
        speed: Math.random() * 0.8 + 0.2,
        alpha: Math.random() * 0.7 + 0.2
      }));

      player.x = canvas.width / 2;
      player.y = canvas.height - 64;
      player.health = 100;
      player.maxHealth = 100;
      player.fireCooldown = 0;
      player.firingRate = 0.18;
      player.shootLevel = 1;
      player.shield = 0;
      player.damageFlash = 0;

      scoreEl.textContent = '0';
      healthEl.textContent = '100';
      waveEl.textContent = '1';
      messageEl.style.display = 'none';
      gameOverEl.style.display = 'none';

      spawnWave();
    }

    function spawnWave() {
      const count = 4 + state.wave * 2;

      for (let i = 0; i < count; i++) {
        const roll = Math.random();
        let kind = 'donut';
        if (roll > 0.7) kind = 'croissant';
        if (roll > 0.88) kind = 'pie';
        if (state.wave > 2 && Math.random() < 0.2) kind = 'muffin';

        const enemy = {
          id: state.nextEnemyId++,
          kind,
          x: randomRange(60, canvas.width - 60),
          y: -30 - Math.random() * 150,
          radius: kind === 'pie' ? 20 : kind === 'croissant' ? 18 : kind === 'muffin' ? 19 : 15,
          hp: 1 + Math.floor(state.wave / 2) + (kind === 'pie' ? 1 : 0),
          speed: 55 + state.wave * 12 + Math.random() * 35,
          drift: randomRange(-90, 90),
          fireCooldown: randomRange(0.8, 1.8),
          phase: Math.random() * Math.PI * 2
        };

        state.enemies.push(enemy);
      }
    }

    function addExplosion(x, y, color, count = 18) {
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i) / count + Math.random() * 0.6;
        const speed = 1.5 + Math.random() * 4.5;
        state.particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 0.4 + Math.random() * 0.9,
          maxLife: 0.4 + Math.random() * 0.9,
          color
        });
      }
    }

    function shootPlayer() {
      if (gameOver) return;
      if (player.fireCooldown > 0) return;

      const bulletCount = player.shootLevel === 1 ? 1 : player.shootLevel === 2 ? 2 : 3;
      const spread = player.shootLevel === 1 ? 0 : player.shootLevel === 2 ? 0.18 : 0.28;

      for (let i = 0; i < bulletCount; i++) {
        const offset = bulletCount === 1 ? 0 : (i - (bulletCount - 1) / 2) * spread;
        state.bullets.push({
          x: player.x + offset * 120,
          y: player.y - 28,
          r: 5,
          vy: -620,
          damage: 1
        });
      }

      player.fireCooldown = player.firingRate;
      addExplosion(player.x, player.y - 15, '#ffe2a0', 7);
    }

    function damagePlayer(amount) {
      if (gameOver) return;
      if (player.shield > 0) {
        player.shield = Math.max(0, player.shield - amount);
        amount *= 0.2;
      }

      player.health = Math.max(0, player.health - amount);
      player.damageFlash = 0.35;
      healthEl.textContent = Math.max(0, Math.round(player.health)).toString();

      if (player.health <= 0) {
        gameOver = true;
        finalScoreEl.textContent = `Final Score: ${state.score}`;
        gameOverEl.style.display = 'flex';
        messageEl.style.display = 'block';
      }
    }

    function givePowerUp(type) {
      if (type === 'heal') {
        player.health = Math.min(player.maxHealth, player.health + 25);
        healthEl.textContent = Math.round(player.health).toString();
        addExplosion(player.x, player.y, '#8ef4b2', 24);
      }

      if (type === 'boost') {
        player.firingRate = Math.max(0.07, player.firingRate - 0.025);
        player.shootLevel = Math.min(3, player.shootLevel + 1);
        addExplosion(player.x, player.y, '#ffd166', 22);
      }

      if (type === 'shield') {
        player.shield = 30;
        addExplosion(player.x, player.y, '#7ad9ff', 20);
      }
    }

    function updateStars(dt) {
      for (const star of state.stars) {
        star.y += star.speed * 60 * dt;
        if (star.y > canvas.height) {
          star.y = -10;
          star.x = Math.random() * canvas.width;
        }
      }
    }

    function updatePlayer(dt) {
      let moveX = 0;
      let moveY = 0;

      if (keys['arrowleft'] || keys['a']) moveX -= 1;
      if (keys['arrowright'] || keys['d']) moveX += 1;
      if (keys['arrowup'] || keys['w']) moveY -= 1;
      if (keys['arrowdown'] || keys['s']) moveY += 1;

      if (moveX || moveY) {
        const len = Math.hypot(moveX, moveY) || 1;
        player.x += (moveX / len) * player.speed * dt;
        player.y += (moveY / len) * player.speed * dt;
      }

      player.x = clamp(player.x, 24, canvas.width - 24);
      player.y = clamp(player.y, 40, canvas.height - 42);

      if (keys[' '] || keys['space']) {
        shootPlayer();
      }

      player.fireCooldown = Math.max(0, player.fireCooldown - dt);
      player.damageFlash = Math.max(0, player.damageFlash - dt);
      if (player.shield > 0) player.shield = Math.max(0, player.shield - dt);
    }

    function killEnemy(index) {
      const enemy = state.enemies[index];
      state.enemies.splice(index, 1);
      state.score += 10 + state.wave * 2;
      scoreEl.textContent = state.score.toString();
      addExplosion(enemy.x, enemy.y, getEnemyColor(enemy.kind), 16);

      if (Math.random() < 0.18) {
        const power = Math.random() < 0.55 ? 'heal' : Math.random() < 0.75 ? 'boost' : 'shield';
        state.powerUps.push({
          x: enemy.x,
          y: enemy.y,
          r: 8,
          type: power,
          pulse: Math.random() * Math.PI * 2
        });
      }
    }

    function getEnemyColor(kind) {
      if (kind === 'donut') return '#ffb385';
      if (kind === 'croissant') return '#f6d589';
      if (kind === 'pie') return '#ff6ab2';
      return '#9be6ff';
    }

    function updateBullets(dt) {
      for (let i = state.bullets.length - 1; i >= 0; i--) {
        const bullet = state.bullets[i];
        bullet.y += bullet.vy * dt;
        if (bullet.y < -20) {
          state.bullets.splice(i, 1);
          continue;
        }

        for (let j = state.enemies.length - 1; j >= 0; j--) {
          const enemy = state.enemies[j];
          const dx = bullet.x - enemy.x;
          const dy = bullet.y - enemy.y;
          const dist = Math.hypot(dx, dy);
          if (dist < enemy.radius + bullet.r + 2) {
            state.bullets.splice(i, 1);
            enemy.hp -= bullet.damage;
            addExplosion(bullet.x, bullet.y, '#ffd666', 7);
            if (enemy.hp <= 0) {
              killEnemy(j);
            }
            break;
          }
        }
      }

      for (let i = state.enemyBullets.length - 1; i >= 0; i--) {
        const bullet = state.enemyBullets[i];
        bullet.y += bullet.vy * dt;
        bullet.x += bullet.vx * dt;

        if (bullet.y > canvas.height + 20) {
          state.enemyBullets.splice(i, 1);
          continue;
        }

        const dx = bullet.x - player.x;
        const dy = bullet.y - player.y;
        const dist = Math.hypot(dx, dy);
        if (dist < player.w * 0.6 + bullet.r) {
          state.enemyBullets.splice(i, 1);
          damagePlayer(10);
        }
      }
    }

    function updateEnemies(dt) {
      for (let i = state.enemies.length - 1; i >= 0; i--) {
        const enemy = state.enemies[i];
        enemy.phase += dt * 2.5;
        enemy.x += Math.sin(enemy.phase) * 30 * dt + enemy.drift * dt * 0.02;

        const dy = player.y - enemy.y;
        const dx = player.x - enemy.x;
        const len = Math.hypot(dx, dy) || 1;
        const speedScale = enemy.kind === 'pie' ? 0.82 : 1;
        enemy.x += (dx / len) * enemy.speed * speedScale * dt;
        enemy.y += (dy / len) * enemy.speed * 0.8 * dt;

        enemy.fireCooldown -= dt;
        if (enemy.fireCooldown <= 0) {
          enemy.fireCooldown = randomRange(0.9, 2.2) * (1 - Math.min(0.45, state.wave * 0.02));
          const ang = Math.atan2(player.y - enemy.y, player.x - enemy.x);
          state.enemyBullets.push({
            x: enemy.x,
            y: enemy.y + enemy.radius * 0.7,
            r: enemy.kind === 'pie' ? 6 : 5,
            vx: Math.cos(ang) * 190,
            vy: Math.sin(ang) * 190,
            color: getEnemyColor(enemy.kind)
          });
        }

        if (enemy.y > canvas.height + 30 || Math.abs(enemy.x - player.x) < 12 && enemy.y > canvas.height - 100) {
          damagePlayer(16);
          state.enemies.splice(i, 1);
          addExplosion(enemy.x, enemy.y, '#ff6b6b', 12);
        }
      }
    }

    function updatePowerUps(dt) {
      for (let i = state.powerUps.length - 1; i >= 0; i--) {
        const item = state.powerUps[i];
        item.pulse += dt * 5;
        item.y += 40 * dt;

        const dx = item.x - player.x;
        const dy = item.y - player.y;
        const dist = Math.hypot(dx, dy);
        if (dist < 26) {
          givePowerUp(item.type);
          state.powerUps.splice(i, 1);
          continue;
        }

        if (item.y > canvas.height + 25) {
          state.powerUps.splice(i, 1);
        }
      }
    }

    function updateParticles(dt) {
      for (let i = state.particles.length - 1; i >= 0; i--) {
        const p = state.particles[i];
        p.x += p.vx * 50 * dt;
        p.y += p.vy * 50 * dt;
        p.life -= dt;
        if (p.life <= 0) {
          state.particles.splice(i, 1);
        }
      }
    }

    function updateWave(dt) {
      if (state.enemies.length === 0) {
        state.waveDelay -= dt;
        if (state.waveDelay <= 0) {
          state.wave += 1;
          waveEl.textContent = state.wave.toString();
          state.waveDelay = 1.1;
          spawnWave();
        }
      } else {
        state.waveDelay = 1.1;
      }
    }

    function update(dt) {
      if (gameOver) return;

      updateStars(dt);
      updatePlayer(dt);
      updateBullets(dt);
      updateEnemies(dt);
      updatePowerUps(dt);
      updateParticles(dt);
      updateWave(dt);
    }

    function drawBackground() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const g = ctx.createLinearGradient(0, 0, 0, canvas.height);
      g.addColorStop(0, '#3a2147');
      g.addColorStop(1, '#080a12');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (const star of state.stars) {
        ctx.fillStyle = `rgba(255,255,255,${star.alpha})`;
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawPlayer() {
      const x = player.x;
      const y = player.y;

      ctx.save();
      ctx.translate(x, y);

      if (player.damageFlash > 0) {
        ctx.shadowColor = 'rgba(255, 90, 90, 0.9)';
        ctx.shadowBlur = 18;
      }

      ctx.fillStyle = '#60d7ff';
      ctx.fillRect(-12, -12, 24, 20);

      ctx.fillStyle = '#ffdc95';
      ctx.fillRect(-18, 8, 36, 14);

      ctx.fillStyle = '#cfe8ff';
      ctx.fillRect(-7, -22, 14, 14);

      ctx.fillStyle = '#ff7b7b';
      ctx.beginPath();
      ctx.moveTo(-10, -30);
      ctx.lineTo(0, -42);
      ctx.lineTo(10, -30);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#ffcd00';
      ctx.fillRect(-2, -48, 4, 14);

      ctx.restore();

      if (player.shield > 0) {
        ctx.beginPath();
        ctx.strokeStyle = 'rgba(122, 217, 255, 0.9)';
        ctx.lineWidth = 2;
        ctx.arc(player.x, player.y, 22 + Math.sin(performance.now() * 0.015) * 2, 0, Math.PI * 2);
        ctx.stroke();
      }

      const barX = player.x - 26;
      const barY = canvas.height - 24;
      ctx.fillStyle = 'rgba(255,255,255,0.18)';
      ctx.fillRect(barX, barY, 52, 8);
      ctx.fillStyle = '#7ce7a7';
      ctx.fillRect(barX, barY, (player.health / player.maxHealth) * 52, 8);
    }

    function drawEnemy(enemy) {
      const color = getEnemyColor(enemy.kind);
      ctx.save();
      ctx.translate(enemy.x, enemy.y);

      ctx.fillStyle = color;
      ctx.strokeStyle = 'rgba(60, 34, 28, 0.5)';
      ctx.lineWidth = 2;

      if (enemy.kind === 'donut') {
        ctx.beginPath();
        ctx.arc(0, 0, enemy.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(0, 0, enemy.radius * 0.48, 0, Math.PI * 2);
        ctx.fillStyle = '#f9e8be';
        ctx.fill();
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(-enemy.radius * 0.32, -enemy.radius * 0.2, 4, 0, Math.PI * 2);
        ctx.arc(enemy.radius * 0.32, -enemy.radius * 0.2, 4, 0, Math.PI * 2);
        ctx.fill();
      } else if (enemy.kind === 'croissant') {
        ctx.beginPath();
        ctx.moveTo(-enemy.radius, -enemy.radius * 0.25);
        ctx.quadraticCurveTo(0, -enemy.radius * 1.3, enemy.radius, -enemy.radius * 0.25);
        ctx.quadraticCurveTo(enemy.radius * 0.8, enemy.radius * 0.9, 0, enemy.radius * 1.1);
        ctx.quadraticCurveTo(-enemy.radius * 0.8, enemy.radius * 0.9, -enemy.radius, -enemy.radius * 0.25);
        ctx.closePath();
        ctx.fill();
      } else if (enemy.kind === 'pie') {
        ctx.beginPath();
        ctx.moveTo(-enemy.radius, -enemy.radius * 0.5);
        ctx.lineTo(enemy.radius, -enemy.radius * 0.5);
        ctx.lineTo(enemy.radius * 0.7, enemy.radius * 0.9);
        ctx.lineTo(-enemy.radius * 0.7, enemy.radius * 0.9);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#f7f0d9';
        ctx.fillRect(-enemy.radius * 0.3, -enemy.radius * 0.1, enemy.radius * 0.6, enemy.radius * 0.5);
      } else {
        ctx.beginPath();
        ctx.arc(0, 0, enemy.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#f7f0d9';
        ctx.fillRect(-enemy.radius * 0.2, -enemy.radius * 0.25, enemy.radius * 0.4, enemy.radius * 0.5);
      }

      ctx.restore();
    }

    function drawBullets() {
      for (const bullet of state.bullets) {
        ctx.fillStyle = '#ffd76a';
        ctx.beginPath();
        ctx.arc(bullet.x, bullet.y, bullet.r, 0, Math.PI * 2);
        ctx.fill();
      }

      for (const bullet of state.enemyBullets) {
        ctx.fillStyle = bullet.color;
        ctx.beginPath();
        ctx.arc(bullet.x, bullet.y, bullet.r, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawPowerUps() {
      for (const item of state.powerUps) {
        const s = 8 + Math.sin(item.pulse) * 2;
        ctx.save();
        ctx.translate(item.x, item.y);
        ctx.fillStyle = item.type === 'heal' ? '#8ef4b2' : item.type === 'boost' ? '#ffd166' : '#7ad9ff';
        ctx.beginPath();
        ctx.arc(0, 0, s, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#1b1d24';
        ctx.font = 'bold 10px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(item.type[0].toUpperCase(), 0, 1);
        ctx.restore();
      }
    }

    function drawParticles() {
      for (const p of state.particles) {
        const alpha = clamp(p.life / p.maxLife, 0, 1);
        ctx.fillStyle = p.color.replace(')', `, ${alpha})`).replace('rgb', 'rgba');
        if (p.color.startsWith('#')) {
          ctx.fillStyle = hexToRgba(p.color, alpha);
        }
        ctx.beginPath();
        ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function hexToRgba(hex, alpha) {
      const normalized = hex.replace('#', '');
      const bigint = Number.parseInt(normalized, 16);
      const r = (bigint >> 16) & 255;
      const g = (bigint >> 8) & 255;
      const b = bigint & 255;
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function render() {
      drawBackground();
      drawPowerUps();
      drawParticles();
      drawBullets();
      for (const enemy of state.enemies) drawEnemy(enemy);
      drawPlayer();

      if (gameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }
    }

    function loop(ts) {
      const dt = Math.min((ts - lastTime) / 1000 || 0.016, 0.033);
      lastTime = ts;
      update(dt);
      render();
      animationId = requestAnimationFrame(loop);
    }

    document.addEventListener('keydown', (event) => {
      const key = event.key.toLowerCase();
      keys[key] = true;

      if (key === 'r' && gameOver) {
        resetGame();
      }

      if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(key)) {
        event.preventDefault();
      }
    });

    document.addEventListener('keyup', (event) => {
      keys[event.key.toLowerCase()] = false;
    });

    restartBtn.addEventListener('click', resetGame);

    resetGame();
    lastTime = performance.now();
    animationId = requestAnimationFrame(loop);
  </script>
</body>
</html>
